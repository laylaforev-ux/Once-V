#pagina{max-width:900px;margin:0 auto;background:var(--celeste);border:1px solid var(--borde);box-shadow:0 8px 28px rgba(0,30,90,.55)}
header{display:flex;gap:16px;align-items:center;padding:14px 20px 12px}
.burbuja{flex:none;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff 0 8%,rgba(255,255,255,.2) 22%,transparent 40%),radial-gradient(circle,rgba(120,200,255,.25) 55%,rgba(255,255,255,.85) 70%,rgba(80,170,240,.5) 74%,transparent 76%)}
.tit{flex:1;min-width:0}
.sub{font-weight:bold;font-size:17px;color:var(--titulo);margin:0}
h1{font:bold clamp(24px,4.6vw,38px)/1.1 Arial,Helvetica,sans-serif;color:var(--titulo);margin:2px 0 0;text-shadow:1px 1px 0 #fff}
nav.sec{background:var(--barra);padding:6px 20px;display:flex;flex-wrap:wrap;gap:4px 22px;border-top:1px solid #fff;border-bottom:1px solid var(--borde)}
nav.sec a{color:#fff;text-decoration:none;font-size:13px}
nav.sec a:hover{text-decoration:underline}

.cols{display:flex;gap:22px;padding:16px 20px 10px;align-items:flex-start}
aside.lado{flex:none;width:170px;font-size:11.5px;line-height:1.4}
aside.lado b{display:block;margin-bottom:5px}
aside.lado ul{list-style:none;margin:0;padding:0}
aside.lado li{margin:0 0 4px;padding-left:12px;position:relative}
aside.lado li::before{content:"●";position:absolute;left:0;top:1px;font-size:8px;color:#7e9db2}
aside.lado li.n3{margin-left:12px;font-size:11px}
main{flex:1;min-width:0}

/* foto: flotante, con marco simple como en la captura */
.foto{float:left;width:200px;margin:0 20px 12px 0;font-size:12px}
.foto .marco{border:1px solid #6d8ea6;background:#fff}
.foto img{display:block;width:100%}
.vacio{height:140px;display:grid;place-items:center;color:#6d8ea6;background:var(--celeste2)}
.foto .pie{padding-top:5px}

.texto p{margin:0 0 12px}
.texto h2{font:bold 17px Arial,sans-serif;color:var(--titulo);margin:22px 0 8px;padding-bottom:3px;border-bottom:1px solid #8fb7d3;clear:both}
.texto h3{font:bold italic 14px Verdana,sans-serif;margin:16px 0 6px;clear:both}
.texto ul{margin:0 0 12px;padding:0;list-style:none}
.texto li{padding-left:16px;position:relative;margin-bottom:3px}
.texto li::before{content:"●";position:absolute;left:2px;top:3px;font-size:9px;color:#7e9db2}
.texto table{border-collapse:separate;border-spacing:2px;width:100%;margin:0 0 14px;font-size:13px;clear:both}
.texto th{background:#8dbfe3;border:1px solid #6ea3cc;padding:4px 8px;text-align:center}
.texto td{background:#bfe3f8;padding:4px 8px;text-align:center}
.texto::after{content:"";display:block;clear:both}

#cuerpoEdit{display:none;width:100%;min-height:420px;padding:10px;font:13px/1.55 Consolas,"Courier New",monospace;border:1px solid var(--borde);background:#fffef0}
.ayuda{display:none;font-size:11.5px;margin:0 0 8px;clear:both}
body.editando #cuerpoEdit,body.editando .ayuda{display:block}
body.editando .texto,body.editando aside.lado,body.editando nav.sec{display:none}
body.editando .foto{float:none;width:220px;margin-bottom:12px}
.fila{display:none;gap:6px;flex-wrap:wrap;padding-top:6px}
body.editando .fila{display:flex}

.final{clear:both;margin:14px 0 6px;font-size:14px}
.final .ant{font-style:italic;font-weight:bold;display:block;margin-bottom:4px}
.final li{list-style:none;padding-left:16px;position:relative}
.final li::before{content:"●";position:absolute;left:2px;top:4px;font-size:9px;color:#7e9db2}
.arriba{margin:14px 20px 16px;display:inline-block;font-size:12px;padding:3px 12px;background:#e9f7ff;border:1px solid #6d8ea6;color:#34566e;text-decoration:none;font-weight:normal}
footer{background:var(--barra);border-top:1px solid var(--borde);padding:8px 20px;color:#fff;font-size:12px;min-height:34px}

.edit-enlaces{display:none}
body.editando .edit-enlaces{display:block}
body.editando #listaEnlaces{display:none}
.er{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.er input{flex:1;min-width:150px}
[contenteditable=true]{background:#fffbd0;outline:1px dashed #b89b00}
[contenteditable=true]:empty::before{content:attr(data-ph);color:#8a8a60;font-weight:normal;text-shadow:none}
input[type=text],input[type=url],input[type=password]{font:13px Verdana,sans-serif;padding:5px 8px;border:1px solid var(--borde);min-width:170px}
dialog{border:1px solid var(--borde);padding:22px;background:var(--celeste);box-shadow:0 10px 36px rgba(0,30,90,.6)}
dialog::backdrop{background:rgba(0,40,110,.5)}
dialog h2{margin:0 0 12px;font:bold 16px Arial,sans-serif;color:var(--titulo)}
.err{color:#b02a1a;font-size:13px;min-height:18px;margin:8px 0}
@media (max-width:700px){.cols{flex-direction:column}aside.lado{width:100%;order:2}.foto{float:none;width:100%;margin:0 0 12px}header{padding:12px}.burbuja{width:50px;height:50px}}
</style>
</head>
<body>

<div class="barra">
  <span class="estado" id="estado">Cargando…</span>
  <button class="btn" id="bEditar">Editar</button>
  <button class="btn" id="bGuardar" hidden>Guardar</button>
  <button class="btn" id="bSalir" hidden>Salir</button>
</div>

<div id="pagina">
  <header>
    <div class="burbuja"></div>
    <div class="tit">
      <p class="sub" id="subtitulo" data-ph="Subtítulo (opcional)"></p>
      <h1 id="titulo" data-ph="Título de la página"></h1>
    </div>
  </header>
  <nav class="sec" id="navSec" hidden></nav>

  <div class="cols">
    <aside class="lado" id="lado" hidden></aside>
    <main>
      <figure class="foto" id="foto" style="margin-left:0;margin-top:0">
        <div class="marco" id="marco"></div>
        <div class="pie" id="pie" data-ph="Pie de foto"></div>
        <div class="fila">
          <input type="file" id="archivo" accept="image/*">
          <button class="btn" id="bQuitarFoto" type="button">Quitar foto</button>
        </div>
      </figure>
      <p class="ayuda">Títulos: <code>== Título ==</code> · Subtítulos: <code>=== Subtítulo ===</code> · Listas: <code>* elemento</code> · Negrita: <code>'''texto'''</code> · Enlaces: <code>[https://web.com texto]</code> · Tablas: filas como <code>| uno | dos | tres |</code> (la primera fila es el encabezado). Línea en blanco = nuevo párrafo.</p>
      <textarea id="cuerpoEdit" placeholder="Tu texto…"></textarea>
      <article class="texto" id="cuerpo"></article>

      <div class="final" id="bloqueEnlace">
        <ul id="listaEnlaces" style="margin:0;padding:0"></ul>
        <div class="edit-enlaces" id="editEnlaces"></div>
        <div class="fila"><button class="btn" id="bAddEnlace" type="button">+ Añadir enlace</button></div>
      </div>
    </main>
  </div>
  <a class="arriba" href="#pagina">▲ Arriba</a>
  <footer id="pieWeb"></footer>
</div>

<dialog id="login">
  <h2>Contraseña de edición</h2>
  <input type="password" id="clave" autocomplete="current-password" placeholder="Contraseña">
  <div class="err" id="err"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" id="bCancelar" type="button">Cancelar</button>
    <button class="btn" id="bEntrar" type="button">Entrar</button>
  </div>
</dialog>

<script type="module">
/* ============ CONFIGURACIÓN ============ */
const FIREBASE = { apiKey:"AIzaSyCaF0-NTk13pt4R4XCsCeufn492WaY4cj4", authDomain:"once-v.firebaseapp.com", projectId:"once-v", appId:"1:834300167050:web:6ea02cd34e9cfd95bf7e73" };
const EMAIL_EDITOR = "lopelio082011@gmail.com";
/* ======================================= */

const $ = id => document.getElementById(id);
const CAMPOS = ["titulo","subtitulo","pie"];
let datos = {titulo:"",subtitulo:"",pie:"",cuerpo:"",foto:"",enlaceTexto:"",enlaceUrl:""};
let nube = null, editando = false;

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline = s => esc(s).replace(/'''(.+?)'''/g,"<b>$1</b>")
  .replace(/\[(https?:\/\/[^\s\]]+)\s+([^\]]+)\]/g,'<a href="$1" target="_blank" rel="noopener">$2</a>');

function render(txt){
  const out=[], toc=[]; let par=[], lista=[], tabla=[], n=0;
  const cierra=()=>{
    if(par.length){out.push("<p>"+par.join(" ")+"</p>");par=[];}
    if(lista.length){out.push("<ul>"+lista.join("")+"</ul>");lista=[];}
    if(tabla.length){
      out.push("<table>"+tabla.map((r,i)=>"<tr>"+r.map(c=>`<${i?"td":"th"}>${inline(c.trim())}</${i?"td":"th"}>`).join("")+"</tr>").join("")+"</table>");tabla=[];}
  };
  for(const raw of txt.split("\n")){
    const l=raw.trim(); let m;
    if(!l){cierra();continue;}
    if((m=l.match(/^===\s*(.+?)\s*===$/))){cierra();const id="s"+(++n);toc.push([3,id,m[1]]);out.push(`<h3 id="${id}">${inline(m[1])}</h3>`);}
    else if((m=l.match(/^==\s*(.+?)\s*==$/))){cierra();const id="s"+(++n);toc.push([2,id,m[1]]);out.push(`<h2 id="${id}">${inline(m[1])}</h2>`);}
    else if(l[0]==="|"){ if(par.length||lista.length){const t=tabla;tabla=[];cierra();tabla=t;} tabla.push(l.replace(/^\||\|$/g,"").split("|")); }
    else if((m=l.match(/^\*\s+(.+)$/))){ if(par.length||tabla.length){cierra();} lista.push("<li>"+inline(m[1])+"</li>"); }
    else { if(lista.length||tabla.length){cierra();} par.push(inline(l)); }
  }
  cierra();
  return {html:out.join(""),toc};
}

const escA = s => esc(s).replace(/"/g,"&quot;");
function sincEnlaces(){
  if(!editando) return;
  datos.enlaces = [...$("editEnlaces").querySelectorAll(".er")].map(r=>({texto:r.children[0].value.trim(),url:r.children[1].value.trim()}));
}
function pintar(){
  if(!datos.enlaces) datos.enlaces = datos.enlaceUrl ? [{texto:datos.enlaceTexto,url:datos.enlaceUrl}] : [];
  sincEnlaces();
  CAMPOS.forEach(c => { if(document.activeElement!==$(c)) $(c).textContent = datos[c]; });
  document.title = datos.titulo || "Mi página";
  $("pieWeb").textContent = datos.titulo;
  const r = render(datos.cuerpo);
  $("cuerpo").innerHTML = r.html;
  const h2 = r.toc.filter(t=>t[0]===2);
  $("navSec").innerHTML = h2.map(t=>`<a href="#${t[1]}">${esc(t[2])}</a>`).join("");
  $("navSec").hidden = !h2.length;
  $("lado").hidden = r.toc.length<2;
  $("lado").innerHTML = r.toc.length<2 ? "" : "<b>Contenido</b><ul>"+r.toc.map(t=>`<li class="${t[0]===3?"n3":""}"><a href="#${t[1]}">${esc(t[2])}</a></li>`).join("")+"</ul>";
  $("cuerpoEdit").value = datos.cuerpo;
  $("marco").innerHTML = datos.foto ? `<img src="${datos.foto}" alt="">` : `<div class="vacio">Sin foto</div>`;
  $("foto").style.display = (datos.foto || datos.pie || editando) ? "" : "none";
  $("pie").style.display = (datos.pie || editando) ? "" : "none";
  const buenos = datos.enlaces.filter(e=>/^https?:\/\//i.test(e.url));
  $("listaEnlaces").innerHTML = buenos.map(e=>`<li><a href="${escA(e.url)}" target="_blank" rel="noopener">${esc(e.texto||e.url)}</a></li>`).join("");
  $("bloqueEnlace").style.display = (buenos.length || editando) ? "" : "none";
  if(editando) $("editEnlaces").innerHTML = datos.enlaces.map(e=>`<div class="er"><input type="text" placeholder="Texto del enlace" value="${escA(e.texto)}"><input type="url" placeholder="https://..." value="${escA(e.url)}"><button class="btn" type="button" data-q>Quitar</button></div>`).join("");
}

async function iniciar(){
  if(!(FIREBASE.apiKey && FIREBASE.projectId)){
    try{ datos = {...datos, ...JSON.parse(localStorage.getItem("folio")||"{}")}; }catch(e){}
    $("estado").textContent = "Modo local (sin nube configurada)"; pintar(); return;
  }
  try{
    const base="https://www.gstatic.com/firebasejs/10.12.2/";
    const [{initializeApp},{getFirestore,doc,getDoc,setDoc},{getAuth,signInWithEmailAndPassword,signOut}] = await Promise.all([
      import(base+"firebase-app.js"),import(base+"firebase-firestore.js"),import(base+"firebase-auth.js")]);
    const app=initializeApp(FIREBASE), db=getFirestore(app), auth=getAuth(app), ref=doc(db,"folio","principal");
    nube = { leer:async()=>(await getDoc(ref)).data(), guardar:d=>setDoc(ref,d),
             entrar:p=>signInWithEmailAndPassword(auth,EMAIL_EDITOR,p), salir:()=>signOut(auth) };
    const s = await nube.leer(); if(s) datos = {...datos,...s};
    $("estado").textContent = "Conectado a la nube";
  }catch(e){ console.error(e); $("estado").textContent = "No se pudo conectar con la nube"; }
  pintar();
}

function modoEdicion(on){
  editando = on; document.body.classList.toggle("editando",on);
  CAMPOS.forEach(c => $(c).contentEditable = on ? "true" : "false");
  $("bEditar").hidden = on; $("bGuardar").hidden = !on; $("bSalir").hidden = !on;
  pintar();
}
$("bEditar").onclick = () => { $("err").textContent=""; $("clave").value=""; $("login").showModal(); $("clave").focus(); };
$("bCancelar").onclick = () => $("login").close();
$("clave").addEventListener("keydown",e=>{ if(e.key==="Enter") $("bEntrar").click(); });
$("bEntrar").onclick = async () => {
  if(!nube){ $("login").close(); modoEdicion(true); return; }
  try{ await nube.entrar($("clave").value); $("login").close(); modoEdicion(true); }
  catch(e){ $("err").textContent = "Contraseña incorrecta."; }
};
$("bSalir").onclick = async () => { if(nube) await nube.salir(); location.reload(); };
$("bGuardar").onclick = async () => {
  CAMPOS.forEach(c => datos[c] = $(c).innerText.trim());
  datos.cuerpo = $("cuerpoEdit").value;
  sincEnlaces();
  datos.enlaces = datos.enlaces.filter(e=>e.url).map(e=>({texto:e.texto,url:/^https?:\/\//i.test(e.url)?e.url:"https://"+e.url}));
  datos.enlaceTexto = ""; datos.enlaceUrl = "";
  try{
    if(nube) await nube.guardar(datos); else localStorage.setItem("folio",JSON.stringify(datos));
    $("estado").textContent = "Guardado ✔"; pintar();
  }catch(e){ console.error(e); $("estado").textContent = "Error al guardar"; }
};
$("archivo").onchange = e => {
  const f=e.target.files[0]; if(!f) return;
  const img=new Image();
  img.onload=()=>{ const k=Math.min(1,700/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=img.width*k; c.height=img.height*k;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    datos.foto=c.toDataURL("image/jpeg",.8); pintar(); };
  img.src=URL.createObjectURL(f);
};
$("bAddEnlace").onclick = () => { sincEnlaces(); datos.enlaces.push({texto:"",url:""}); pintar(); };
$("editEnlaces").addEventListener("click",e=>{ if(e.target.dataset.q!==undefined){ e.target.closest(".er").remove(); sincEnlaces(); } });
$("bQuitarFoto").onclick = () => { datos.foto=""; pintar(); };
iniciar();
</script>
</body>
</html>
